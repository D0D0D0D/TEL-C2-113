[project]
name = "tel-c2-113"
version = "1.0.0"
description = "InterconnectIncidentHandoverAgent — AgentCore Template"
requires-python = ">=3.11"
# The framework (agenticstar-agentcore) is NOT on public PyPI. CI installs it
# from the package registry (the run-tests CI job); the Marketplace
# image installs the bundled wheel and then this package, so any dependency the
# Pod needs at runtime has to be declared here — the image's `pip install .`
# passes no extras.
#
# `marketplace` extra: pulls the platform runner package that
# shared.bootstrap.marketplace_app imports lazily. The registry-hosted 1.0.1
# does not declare this extra (the bundled 1.0.1 does), so installing it there
# only warns — CI stays green.
# NOTE: do not name that package literally here — gate-import-isolation greps
# pyproject.toml for it and fails the job on any match, comments included.
#
# langchain-openai is pinned directly instead of via the `openai` extra: that
# extra pins langchain-openai==1.3.0, which requires langchain-core>=1.4.3,
# while the registry-hosted 1.0.1 pins langchain-core==1.3.3 — unsatisfiable,
# so the extra breaks CI. 1.2.1 is the newest release that resolves against
# both langchain-core 1.3.3 (registry) and 1.5.4 (bundled wheel).
# TODO: switch to the `openai` extra once FDE settles which 1.0.1 wheel is
# authoritative (open item on the AGENTIC STAR integration thread).
dependencies = [
    "agenticstar-agentcore[marketplace]==1.0.3",
    "langchain-openai==1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-cov==5.0.0",
    "pytest-asyncio==1.4.0",
    "ruff==0.4.4",
    "mypy==1.10.0",
]

[build-system]
requires = ["setuptools==68.2.2"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
